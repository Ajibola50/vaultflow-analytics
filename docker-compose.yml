services:
  postgres:
    image: postgres:16
    container_name: vaultflow_postgres
    environment:
      POSTGRES_USER: vaultflow_admin
      POSTGRES_PASSWORD: changeme_dev_only
      POSTGRES_DB: vaultflow
    ports:
      - "5432:5432"
    volumes:
      - vaultflow_pgdata:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:latest
    container_name: vaultflow_metabase
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  vaultflow_pgdata: